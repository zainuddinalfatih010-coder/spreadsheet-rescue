<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROJECT-3-TIK</title>
<style>html,body{margin:0;width:100%;height:100%;background:#1f1b17;color:#eee;font:16px system-ui;display:grid;place-items:center}#status{opacity:.72;letter-spacing:.02em}</style>
</head>
<body><div id="status">Loading PROJECT-3-TIK…</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('Browser terlalu lama. Buka dengan Chrome/Edge/Firefox terbaru.');
    const b64=(await (await fetch('./game.gz.b64?build=v1.2-mega',{cache:'no-store'})).text()).trim();
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error('[PROJECT-3-TIK loader]',err);
    status.textContent='Gagal memuat PROJECT-3-TIK: '+(err&&err.message?err.message:String(err));
  }
})();
</script></body></html>
