name: Deploy Spreadsheet Rescue to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PROJECT-3-TIK game HTML
        shell: bash
        run: |
          mkdir -p PROJECT-3-TIK
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://project-3-tik-gptacece2-4164s-projects.vercel.app/' \
            --output PROJECT-3-TIK/index.html
          test -s PROJECT-3-TIK/index.html
          bytes=$(wc -c < PROJECT-3-TIK/index.html)
          echo "Fetched game HTML: ${bytes} bytes"
          test "$bytes" -gt 300000
          if grep -qi '<iframe' PROJECT-3-TIK/index.html; then
            echo 'Unexpected iframe in fetched game HTML' >&2
            exit 1
          fi
          grep -q 'requestAnimationFrame' PROJECT-3-TIK/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: HTTP smoke test public PROJECT-3-TIK
        shell: bash
        run: |
          url='${{ steps.deployment.outputs.page_url }}PROJECT-3-TIK/?smoke=${{ github.sha }}'
          echo "$url" > /tmp/project3-url.txt
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/project3-live.html -w '%{http_code}' "$url" || true)
            bytes=$(wc -c < /tmp/project3-live.html 2>/dev/null || echo 0)
            echo "Attempt $i: HTTP $code, ${bytes} bytes"
            if [ "$code" = '200' ] && [ "$bytes" -gt 300000 ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = '1'
          grep -q 'requestAnimationFrame' /tmp/project3-live.html
          ! grep -qi '<iframe' /tmp/project3-live.html
          ! grep -q 'game.gz.b64' /tmp/project3-live.html
          echo 'PUBLIC_HTTP_SMOKE_PASS'

      - name: Capture live browser evidence
        shell: bash
        run: |
          url=$(cat /tmp/project3-url.txt)
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "Browser: $browser"
          test -n "$browser"
          timeout 45 "$browser" --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --dump-dom "$url" > /tmp/project3-dom.html 2>/tmp/chrome-dom.log || true
          timeout 45 "$browser" --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --window-size=1280,720 \
            --screenshot=/tmp/project3-live.png "$url" >/tmp/chrome-shot.log 2>&1 || true
          test -s /tmp/project3-live.png
          pngbytes=$(wc -c < /tmp/project3-live.png)
          echo "Screenshot: ${pngbytes} bytes"
          test "$pngbytes" -gt 10000
          echo "Canvas occurrences in rendered DOM: $(grep -io '<canvas' /tmp/project3-dom.html | wc -l)"
          echo 'PUBLIC_BROWSER_CAPTURE_PASS'

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project3-live-browser-evidence
          path: |
            /tmp/project3-live.png
            /tmp/project3-dom.html
            /tmp/project3-live.html
            /tmp/chrome-dom.log
            /tmp/chrome-shot.log
            /tmp/project3-url.txt
          retention-days: 1
