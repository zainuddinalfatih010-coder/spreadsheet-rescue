name: HAND FX Native APK
on:
  workflow_dispatch:
  push:
    branches: [handfx-native]
    paths:
      - 'native-android-source.tar.gz'
      - '.github/workflows/native-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract native project
        run: |
          rm -rf native-android
          mkdir -p native-android
          tar -xzf native-android-source.tar.gz -C native-android
      - name: Download official MediaPipe hand model
        run: |
          mkdir -p native-android/app/src/main/assets
          curl -L --fail --retry 3 \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task \
            -o native-android/app/src/main/assets/hand_landmarker.task
      - name: Build debug APK
        working-directory: native-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HAND-FX-Native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
