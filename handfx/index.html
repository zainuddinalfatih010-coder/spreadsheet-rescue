<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050507"><title>HAND//FX</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100%;overflow:hidden}body{display:grid;place-items:center}.app{position:relative;width:min(100vw,520px);height:100dvh;background:#08080c;overflow:hidden}.stage{position:absolute;inset:0 0 118px}.stage canvas{width:100%;height:100%;display:block;background:#111}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:4}.pill,.icon{border:1px solid #ffffff22;background:#08080b99;backdrop-filter:blur(12px);border-radius:999px;padding:8px 11px;font-size:12px}.icon{width:40px;height:40px;padding:0;font-size:21px;color:#fff}.status{position:absolute;z-index:4;top:max(60px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);font-size:11px;border:1px solid #ffffff22;border-radius:999px;background:#08080baa;padding:7px 10px;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffd66b;margin-right:7px;box-shadow:0 0 10px currentColor}.controls{position:absolute;z-index:5;left:0;right:0;bottom:0;height:118px;background:linear-gradient(#0a0a0f,#050507);border-top:1px solid #ffffff12;display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;padding:10px 18px max(12px,env(safe-area-inset-bottom))}.small{height:48px;border:1px solid #ffffff22;border-radius:15px;background:#111119;color:#fff;font-weight:700}.rec{width:72px;height:72px;border-radius:50%;border:3px solid #fff;background:transparent;padding:6px;justify-self:center}.rec span{display:block;width:100%;height:100%;border-radius:50%;background:#ff4056;transition:.2s}.rec.on span{width:30px;height:30px;border-radius:8px;margin:auto}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:26px;background:linear-gradient(#05050755,#050507e8);backdrop-filter:blur(5px)}.card{width:min(100%,390px);background:#101017e8;border:1px solid #ffffff1f;border-radius:24px;padding:23px;text-align:center}.card h1{margin:0 0 9px;font-size:28px;line-height:1.05}.card p{color:#aaaab5;font-size:14px;line-height:1.45}.go{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;background:#f5f5fa;color:#08080c;font-size:15px}.tiny{font-size:11px!important;color:#858691!important}.hidden{display:none!important}.count{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);font-size:110px;font-weight:900;text-shadow:0 8px 50px #000}.hint{position:absolute;z-index:4;left:50%;bottom:130px;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:#08080baa;border:1px solid #ffffff20;border-radius:999px;padding:7px 10px}.preview video{width:100%;max-height:62dvh;border-radius:16px;background:#000}.row{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:10px}.row button{border:0;border-radius:13px;padding:12px;font-weight:800}.again{background:#282832;color:#fff}.save{background:#f5f5fa;color:#08080c}@media(min-width:520px){.app{height:min(100dvh,900px);border-radius:24px;border:1px solid #ffffff16}}
</style></head><body><main class="app"><section class="stage"><canvas id="c" width="720" height="1280"></canvas><video id="v" autoplay playsinline muted hidden></video><div class="hud"><div class="pill"><b>HAND//FX</b> · LIVE</div><button id="flip" class="icon">↻</button></div><div class="status"><span class="dot" id="dot"></span><span id="st">Belum mulai</span></div><div class="hint">Cubit jempol + telunjuk, lalu gerakkan tanganmu</div><div id="count" class="count hidden">3</div></section><section class="controls"><button id="debug" class="small">TRACK OFF</button><button id="rec" class="rec" disabled><span></span></button><button id="fx" class="small">FX 100%</button></section><div id="start" class="overlay"><div class="card"><div style="font-size:35px">✦</div><h1>Hand tracking tanpa ribuan keyframe.</h1><p>Neon prism bakal otomatis nempel ke tanganmu secara realtime.</p><button id="go" class="go">Nyalakan Kamera</button><p class="tiny">Diproses langsung di HP-mu. Beri izin kamera saat diminta.</p></div></div><div id="preview" class="overlay preview hidden"><div class="card"><video id="pv" playsinline controls loop></video><div class="row"><button id="again" class="again">Ulang</button><button id="save" class="save">Simpan / Share</button></div><p id="note" class="tiny"></p></div></div></main><script type="module">
import{FilesetResolver,HandLandmarker}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.26/+esm';
const $=s=>document.querySelector(s),c=$('#c'),x=c.getContext('2d',{alpha:false}),v=$('#v'),go=$('#go'),start=$('#start'),rec=$('#rec'),st=$('#st'),dot=$('#dot'),flip=$('#flip'),debugBtn=$('#debug'),fxBtn=$('#fx'),count=$('#count'),preview=$('#preview'),pv=$('#pv'),again=$('#again'),save=$('#save'),note=$('#note');
let lm,stream,face='user',run=false,res=null,lastT=-1,lastD=0,debug=false,fx=1,sm=new Map(),mr,chunks=[],blob=null,recording=false;
const W=720,H=1280,MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.26/wasm';
function status(t,ok=false){st.textContent=t;dot.style.background=ok?'#8dffad':'#ffd66b';dot.style.color=ok?'#8dffad':'#ffd66b'}
async function tracker(){if(lm)return;status('Memuat hand tracker…');const vision=await FilesetResolver.forVisionTasks(WASM);try{lm=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.45,minHandPresenceConfidence:.45,minTrackingConfidence:.45})}catch(e){lm=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'CPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.45,minHandPresenceConfidence:.45,minTrackingConfidence:.45})}status('Tracker siap')}
function stopCam(){stream?.getTracks().forEach(t=>t.stop());stream=null}
async function camera(){stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});v.srcObject=stream;await v.play();run=true;rec.disabled=false;start.classList.add('hidden');loop()}
function crop(){const vw=v.videoWidth||1280,vh=v.videoHeight||720,tr=W/H,sr=vw/vh;if(sr>tr){const sh=vh,sw=sh*tr;return{sx:(vw-sw)/2,sy:0,sw,sh,vw,vh}}const sw=vw,sh=sw/tr;return{sx:0,sy:(vh-sh)/2,sw,sh,vw,vh}}
function point(p){const q=crop(),sx=p.x*q.vw,sy=p.y*q.vh;let nx=(sx-q.sx)/q.sw,ny=(sy-q.sy)/q.sh;if(face==='user')nx=1-nx;return{x:nx*W,y:ny*H,z:p.z||0}}
function smooth(k,p,a=.34){const o=sm.get(k);if(!o){sm.set(k,p);return p}const n={x:o.x+(p.x-o.x)*a,y:o.y+(p.y-o.y)*a,z:o.z+(p.z-o.z)*a};sm.set(k,n);return n}
function anchor(i){const h=res?.landmarks?.[i];if(!h)return null;const a=point(h[4]),b=point(h[8]);return smooth('a'+i,{x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2})}
function frame(){if(v.readyState<2){x.fillStyle='#111';x.fillRect(0,0,W,H);return}const q=crop();x.save();if(face==='user'){x.translate(W,0);x.scale(-1,1)}x.drawImage(v,q.sx,q.sy,q.sw,q.sh,0,0,W,H);x.restore();const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#00000015');g.addColorStop(.75,'#00000000');g.addColorStop(1,'#00000055');x.fillStyle=g;x.fillRect(0,0,W,H)}
function prism(){let n=res?.landmarks?.length||0;if(!n)return;let a=anchor(0),b=n>1?anchor(1):null;if(!b){const h=res.landmarks[0];a=smooth('thumb',point(h[4]));b=smooth('index',point(h[8]))}if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.max(20,Math.hypot(dx,dy)),nx=-dy/d,ny=dx/d,t=Math.min(92,Math.max(28,d*.12))*fx,dep=t*.72,px=(dy/d)*dep*.55,py=(-dx/d)*dep*.55,p1={x:a.x-nx*t/2,y:a.y-ny*t/2},p2={x:b.x-nx*t/2,y:b.y-ny*t/2},p3={x:b.x+nx*t/2,y:b.y+ny*t/2},p4={x:a.x+nx*t/2,y:a.y+ny*t/2},qs=[p1,p2,p3,p4].map(p=>({x:p.x+px,y:p.y+py})),hue=performance.now()*.04%360,g=x.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,`hsla(${hue},100%,60%,.95)`);g.addColorStop(.35,`hsla(${(hue+90)%360},100%,70%,.9)`);g.addColorStop(.65,'rgba(255,255,255,.95)');g.addColorStop(1,`hsla(${(hue+210)%360},100%,60%,.95)`);x.save();x.globalCompositeOperation='screen';x.shadowColor=`hsla(${hue},100%,65%,.9)`;x.shadowBlur=30*fx;x.globalAlpha=.32;x.fillStyle=g;x.beginPath();x.moveTo(p1.x,p1.y);x.lineTo(p2.x,p2.y);x.lineTo(p3.x,p3.y);x.lineTo(p4.x,p4.y);x.closePath();x.fill();x.globalAlpha=.95;x.strokeStyle='#ffffffdd';x.lineWidth=4*fx;for(const poly of [[p1,p2,p3,p4],qs]){x.beginPath();x.moveTo(poly[0].x,poly[0].y);poly.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.closePath();x.stroke()}[[p1,qs[0]],[p2,qs[1]],[p3,qs[2]],[p4,qs[3]]].forEach(e=>{x.beginPath();x.moveTo(e[0].x,e[0].y);x.lineTo(e[1].x,e[1].y);x.stroke()});x.strokeStyle=g;x.lineWidth=12*fx;x.globalAlpha=.55;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.restore()}
function dbg(){if(!debug||!res?.landmarks)return;x.save();x.globalCompositeOperation='screen';res.landmarks.forEach(h=>h.forEach((p,i)=>{const q=point(p);x.fillStyle=i===4||i===8?'#fff':'#70ffd0';x.beginPath();x.arc(q.x,q.y,i===4||i===8?6:3,0,Math.PI*2);x.fill()}));x.restore()}
function detect(){if(!lm||v.readyState<2)return;const now=performance.now();if(v.currentTime!==lastT&&now-lastD>28){lastT=v.currentTime;lastD=now;try{res=lm.detectForVideo(v,now);const n=res?.landmarks?.length||0;status(n?`${n} tangan terkunci`:'Cari tanganmu di frame',!!n)}catch(e){console.warn(e)}}}
function loop(){if(!run)return;frame();detect();prism();dbg();requestAnimationFrame(loop)}
async function cd(){count.classList.remove('hidden');for(const n of['3','2','1']){count.textContent=n;await new Promise(r=>setTimeout(r,600))}count.textContent='GO';await new Promise(r=>setTimeout(r,300));count.classList.add('hidden')}
function mime(){return['video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||''}
async function startRec(){await cd();chunks=[];const cs=c.captureStream(30),m=mime();try{mr=m?new MediaRecorder(cs,{mimeType:m,videoBitsPerSecond:7000000}):new MediaRecorder(cs)}catch{mr=new MediaRecorder(cs)}mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{blob=new Blob(chunks,{type:mr.mimeType||m||'video/webm'});pv.src=URL.createObjectURL(blob);note.textContent=blob.type.includes('mp4')?'Terekam MP4.':'Terekam WebM; tombol Share biasanya tetap bisa mengirim ke editor/TikTok.';preview.classList.remove('hidden')};mr.start(250);recording=true;rec.classList.add('on')}
function stopRec(){if(mr?.state!=='inactive')mr.stop();recording=false;rec.classList.remove('on')}
rec.onclick=()=>recording?stopRec():startRec();
go.onclick=async()=>{go.disabled=true;go.textContent='Menyiapkan…';try{await tracker();await camera()}catch(e){console.error(e);go.disabled=false;go.textContent='Coba Lagi';status('Gagal mulai');alert((e.message||e)+'\n\nPastikan izin kamera diberikan dan link dibuka lewat HTTPS.')}};
flip.onclick=async()=>{face=face==='user'?'environment':'user';sm.clear();try{await camera()}catch{face=face==='user'?'environment':'user';await camera()}};
debugBtn.onclick=()=>{debug=!debug;debugBtn.textContent='TRACK '+(debug?'ON':'OFF')};
fxBtn.onclick=()=>{fx=fx===1?1.35:fx===1.35?0.72:1;fxBtn.textContent='FX '+Math.round(fx*100)+'%'};
again.onclick=()=>{preview.classList.add('hidden');pv.pause();pv.removeAttribute('src');pv.load();blob=null};
save.onclick=async()=>{if(!blob)return;const ext=blob.type.includes('mp4')?'mp4':'webm',file=new File([blob],`handfx-${Date.now()}.${ext}`,{type:blob.type});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'HAND//FX'});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()};
</script></body></html>
