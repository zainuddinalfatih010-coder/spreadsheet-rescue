<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<body><div class="boot"><div class="box"><div class="spin">✦</div><h2>HAND//FX V7.0</h2><p>Loading spell shields & dual casting…</p><small>HTTPS runtime</small></div></div>
<script>
(async()=>{
try{
  let s=await (await fetch('./v6-3.html?v=70',{cache:'no-store'})).text();
  if(!s.includes('HAND//FX V6.3')) throw new Error('Baseline V6.3 gagal dimuat.');

  const extra7=String.raw`
    t=t.replaceAll('HAND//FX V6.3','HAND//FX V7.0');
    t=t.replaceAll('· V6.3','· V7.0');
    t=t.replace('6 Materials · constellation · liquid · portal tunnel','SPELL CORE · palm shields · dual casting');
    t=t.replace('Tracking + proper mask tetap sama. FX sekarang punya 6 mode: Iridescent, Negative, Electric, Constellation, Liquid Holo, dan Portal Tunnel.','Semua mode V6.3 tetap ada. Buka telapak untuk memanggil spell shield; dua telapak = dual casting. Tombol SPELL mengganti Eldritch, Arcane, dan Void.');

    const v70Code="const SPELL_STYLES=[{id:'eldritch',short:'ELD',label:'ELDRITCH',hue:28,hue2:48},{id:'arcane',short:'ARC',label:'ARCANE',hue:188,hue2:220},{id:'void',short:'VOID',label:'VOID',hue:278,hue2:325}];let spellStyleIndex=0,spellBtn=null;\nfunction spellStyle(){return SPELL_STYLES[spellStyleIndex%SPELL_STYLES.length]}\nfunction spellClamp(x,a,b){return Math.max(a,Math.min(b,x))}\nfunction spellColor(h,s,l,a){return 'hsla('+(((h%360)+360)%360)+','+s+'%,'+l+'%,'+a+')'}\nfunction ensureSpellButton(){if(spellBtn)return;const top=document.querySelector('.top');if(!top)return;spellBtn=document.createElement('button');spellBtn.className='pill';spellBtn.style.cssText='height:42px;padding:0 11px;font-weight:900;font-size:11px;min-width:82px;color:#fff;cursor:pointer';top.insertBefore(spellBtn,top.lastElementChild);const sync=()=>{const s=spellStyle();spellBtn.textContent='SPELL '+s.short;spellBtn.style.boxShadow='0 0 18px '+spellColor(s.hue,100,64,.22)};spellBtn.addEventListener('click',()=>{spellStyleIndex=(spellStyleIndex+1)%SPELL_STYLES.length;sync()});sync()}\nfunction spellHandState(i){const hand=results?.landmarks?.[i],th=trackedHands?.[i];if(!hand||!th)return null;const open=(th.states||[]).filter(s=>s.open).length;if(open<4)return null;const ids=[0,5,9,13,17],ps=ids.map(j=>mapScreen(hand[j])),c={x:ps.reduce((a,p)=>a+p.x,0)/ps.length,y:ps.reduce((a,p)=>a+p.y,0)/ps.length},p0=ps[0],p5=ps[1],p9=ps[2],p17=ps[4],pw=Math.hypot(p17.x-p5.x,p17.y-p5.y),ph=Math.hypot(p9.x-p0.x,p9.y-p0.y),r=spellClamp(pw*1.18+ph*.62,74,178),angle=Math.atan2(p17.y-p5.y,p17.x-p5.x),zSide=Math.abs((hand[5].z||0)-(hand[17].z||0)),zDepth=(hand[9].z||0)-(hand[0].z||0),squash=spellClamp(1-zSide*4.6,.56,1);return{hand,i,open,c,r,angle,squash,zDepth}}\nfunction drawSpellDiamond(x,y,size,rot,hue,alpha){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.strokeStyle=spellColor(hue,100,84,alpha);ctx.lineWidth=1.15*fx;ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(size*.72,0);ctx.lineTo(0,size);ctx.lineTo(-size*.72,0);ctx.closePath();ctx.stroke();ctx.restore()}\nfunction drawSpellCircle(st,now,idx){const S=spellStyle(),base=(S.hue+now*.018+st.zDepth*520+idx*17+720)%360,r=st.r*(1+.018*Math.sin(now*.006+idx));ctx.save();ctx.globalCompositeOperation='screen';ctx.translate(st.c.x,st.c.y);ctx.rotate(st.angle);ctx.scale(1,st.squash);const bg=ctx.createRadialGradient(0,0,r*.05,0,0,r);bg.addColorStop(0,spellColor(S.hue2,100,58,.10));bg.addColorStop(.55,spellColor(base,100,54,.055));bg.addColorStop(.84,spellColor(S.hue,100,62,.04));bg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.shadowColor=spellColor(base,100,62,1);ctx.shadowBlur=24*fx;ctx.strokeStyle=spellColor(base,100,68,.92);ctx.lineWidth=4.8*fx;ctx.beginPath();ctx.arc(0,0,r*.96,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=6*fx;ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=1.35*fx;ctx.stroke();for(let ring=0;ring<3;ring++){const rr=r*(.78-ring*.14),spin=(now*(ring%2?-.0009:.0012)+idx*.7+ring*.9)%(Math.PI*2);ctx.save();ctx.rotate(spin);ctx.shadowBlur=10*fx;ctx.strokeStyle=spellColor((base+ring*34)%360,100,75,.66-ring*.09);ctx.lineWidth=(2.2-ring*.28)*fx;for(let k=0;k<6;k++){const a=k*Math.PI/3+.12*ring;ctx.beginPath();ctx.arc(0,0,rr,a,a+.55);ctx.stroke()}ctx.restore()}ctx.save();ctx.rotate(-now*.0014+idx*.3);for(let k=0;k<24;k++){const a=k*Math.PI*2/24,major=k%3===0,ri=r*(major?.68:.72),ro=r*(major?.82:.78);ctx.strokeStyle=spellColor((base+k*2.5)%360,100,83,major?.75:.42);ctx.lineWidth=(major?1.9:.9)*fx;ctx.beginPath();ctx.moveTo(Math.cos(a)*ri,Math.sin(a)*ri);ctx.lineTo(Math.cos(a)*ro,Math.sin(a)*ro);ctx.stroke()}ctx.restore();ctx.save();ctx.rotate(now*.0017+idx*.5);for(let k=0;k<12;k++){const a=k*Math.PI*2/12,rr=r*.59,x=Math.cos(a)*rr,y=Math.sin(a)*rr;drawSpellDiamond(x,y,r*.035,a+Math.PI/4,(base+k*7)%360,.72)}ctx.restore();ctx.save();ctx.rotate(-now*.001+idx*.2);ctx.strokeStyle=spellColor(S.hue2,100,83,.72);ctx.lineWidth=1.55*fx;ctx.beginPath();for(let k=0;k<8;k++){const a=-Math.PI/2+k*Math.PI*2/8,rr=k%2===0?r*.42:r*.20,x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.17,0,Math.PI*2);ctx.stroke();ctx.restore();if(S.id==='eldritch'){for(let k=0;k<18;k++){const a=now*.002+k*2.399+idx*.7,rr=r*(.92+.12*Math.sin(k*5.1+now*.004)),x=Math.cos(a)*rr,y=Math.sin(a)*rr,len=r*(.06+.05*((k%4)/3));ctx.strokeStyle=spellColor(28+k*2,100,70,.34+.32*Math.sin(now*.004+k));ctx.lineWidth=(1+k%3*.35)*fx;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a+.55)*len,y+Math.sin(a+.55)*len);ctx.stroke()}}else if(S.id==='arcane'){for(let k=0;k<7;k++){const a=now*.0013+k*Math.PI*2/7,rr=r*.50;ctx.fillStyle=spellColor(188+k*5,100,82,.42);ctx.shadowBlur=10*fx;ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,2.4*fx,0,Math.PI*2);ctx.fill()}}else{ctx.save();ctx.rotate(now*.0007);ctx.strokeStyle=spellColor(312,100,74,.34);ctx.lineWidth=5*fx;ctx.setLineDash([r*.08,r*.055]);ctx.beginPath();ctx.arc(0,0,r*.86,0,Math.PI*2);ctx.stroke();ctx.restore()}ctx.restore()}\nfunction drawDualSpellLink(a,b,now){const S=spellStyle(),mx=(a.c.x+b.c.x)/2,my=(a.c.y+b.c.y)/2,d=Math.hypot(b.c.x-a.c.x,b.c.y-a.c.y);ctx.save();ctx.globalCompositeOperation='screen';const g=ctx.createLinearGradient(a.c.x,a.c.y,b.c.x,b.c.y);g.addColorStop(0,spellColor(S.hue,100,72,.08));g.addColorStop(.5,spellColor(S.hue2,100,82,.48));g.addColorStop(1,spellColor(S.hue,100,72,.08));ctx.strokeStyle=g;ctx.lineWidth=2.2*fx;ctx.shadowColor=spellColor(S.hue2,100,70,1);ctx.shadowBlur=14*fx;ctx.beginPath();ctx.moveTo(a.c.x,a.c.y);ctx.quadraticCurveTo(mx,my-Math.min(70,d*.12),b.c.x,b.c.y);ctx.stroke();const rr=spellClamp(d*.075,18,42),spin=now*.002;ctx.translate(mx,my);ctx.rotate(spin);ctx.strokeStyle=spellColor(S.hue2,100,84,.62);ctx.lineWidth=1.4*fx;ctx.beginPath();for(let k=0;k<6;k++){const ang=-Math.PI/2+k*Math.PI/3,x=Math.cos(ang)*rr,y=Math.sin(ang)*rr;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(0,0,rr*.58,0,Math.PI*2);ctx.stroke();ctx.restore()}\nfunction drawSpellSuite(now){ensureSpellButton();if(!results?.landmarks)return;const states=[];for(let i=0;i<Math.min(2,results.landmarks.length);i++){const st=spellHandState(i);if(st)states.push(st)}for(let i=0;i<states.length;i++)drawSpellCircle(states[i],now,i);if(states.length>=2)drawDualSpellLink(states[0],states[1],now)}\n";
    if(!t.includes('drawPresetOverlay(now);drawV63Overlay(now);if(debug)drawDebug(now)}')) throw new Error('V7 draw hook tidak ditemukan.');
    t=t.replace('function drawMesh(now){',v70Code+'function drawMesh(now){');
    t=t.replace('drawPresetOverlay(now);drawV63Overlay(now);if(debug)drawDebug(now)}','drawPresetOverlay(now);drawV63Overlay(now);drawSpellSuite(now);if(debug)drawDebug(now)}');
  `;

  const markerIndex=s.indexOf("  const marker='    document.open();document.write(t);document.close();");
  if(markerIndex<0) throw new Error('V6.3 patch marker tidak ditemukan.');
  const close=s.lastIndexOf('  `;',markerIndex);
  if(close<0) throw new Error('V6.3 extra block tidak ditemukan.');
  s=s.slice(0,close)+extra7+'\n'+s.slice(close);
  s=s.replace('<title>HAND//FX V6.3 Loader</title>','<title>HAND//FX V7.0 Loader</title>')
     .replace('<h2>HAND//FX V6.3</h2>','<h2>HAND//FX V7.0</h2>')
     .replace('Loading constellation, liquid holo & portal tunnel…','Loading spell shields & dual casting…');

  document.open();document.write(s);document.close();
}catch(e){
  console.error(e);
  document.body.innerHTML='<div class="boot"><div class="box"><h2>V7.0 gagal boot</h2><p>'+String(e.message||e)+'</p><small>Refresh halaman HTTPS ini.</small></div></div>';
}
})();
</script></body></html>
