<style>

<body><div class="boot"><div class="box"><div class="spin">✦</div><h2>HAND//FX V6.1</h2><p>Loading proper holographic mask engine…</p><small>HTTPS runtime</small></div></div>
<script>
(async()=>{
  try{
    let t=await (await fetch('./v5-3.html?v=6',{cache:'no-store'})).text();
    if(!t.includes('HAND//FX V5.3')) throw new Error('Baseline V5.3 gagal dimuat.');

    t=t.replaceAll('HAND//FX V5.3','HAND//FX V6.1');
    t=t.replaceAll('· V5.3','· V6.1');
    t=t.replace('Semi-bent fingers · stable topology · low latency','Proper Mask · 2-hand summon · 1-hand wipe off');
    t=t.replace('Jari lurus maupun sedikit menekuk tetap bisa jadi vertex; jari yang benar-benar menggenggam baru dibuang. Mesh tetap tajam dan low-latency.','V5.3 hand mesh tetap dipertahankan. Dua tangan menyapu wajah untuk memanggil topeng; satu tangan usap dari atas ke bawah untuk menghapusnya.');

    t=t.replace(
      "const W=720,H=1280,MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';",
      "const W=720,H=1280,MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',FACE_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';"
    );

    t=t.replace(
      "let stream=null,facing='user',running=false,handLandmarker=null,results=null,FilesetResolver=null,HandLandmarker=null;",
      "let stream=null,facing='user',running=false,handLandmarker=null,faceLandmarker=null,results=null,faceResults=null,FilesetResolver=null,HandLandmarker=null,FaceLandmarker=null;"
    );

    t=t.replace(
      "let lastVideoTime=-1,lastDetect=0,debug=false,fx=1,actualCamFps='?',renderFps=0,rafCount=0,rafWindow=performance.now();",
      "let lastVideoTime=-1,lastDetect=0,lastFaceDetect=0,debug=false,fx=1,actualCamFps='?',renderFps=0,rafCount=0,rafWindow=performance.now();"
    );

    t=t.replace(
      "let trackedHands=[],motion=new Map(),fingerState=new Map();",
      "let trackedHands=[],motion=new Map(),fingerState=new Map(),faceGeom=null,lastFaceSeen=0,maskActive=false,maskStart=0,maskProgress=0,maskDismissStart=0,maskDismissDuration=300,dismissTrack=null,washNearSince=0,washCooldown=0,washPrev=null,faceTrackerError='';"
    );

    t=t.replace(
      "FilesetResolver=mod.FilesetResolver;HandLandmarker=mod.HandLandmarker;",
      "FilesetResolver=mod.FilesetResolver;HandLandmarker=mod.HandLandmarker;FaceLandmarker=mod.FaceLandmarker;"
    );

    const trackerNeedle="try{handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}catch(e){opts.baseOptions.delegate='CPU';handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}setStatus(`Tracker siap · ${actualCamFps}fps cam`,true);diagnostic('state: tracker ready')";
    const trackerReplacement="try{handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}catch(e){opts.baseOptions.delegate='CPU';handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}try{const fopts={baseOptions:{modelAssetPath:FACE_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45,outputFaceBlendshapes:false,outputFacialTransformationMatrixes:false};try{faceLandmarker=await FaceLandmarker.createFromOptions(vision,fopts)}catch(fe){fopts.baseOptions.delegate='CPU';faceLandmarker=await FaceLandmarker.createFromOptions(vision,fopts)}}catch(fe){faceTrackerError=fe?.message||String(fe);console.warn('Face tracker unavailable',fe)}setStatus(faceLandmarker?`Hand + face siap · ${actualCamFps}fps cam`:`Hand siap · face gagal`,true);diagnostic(faceLandmarker?'state: hand + face tracker ready':'FACE ERROR: '+faceTrackerError)";
    if(!t.includes(trackerNeedle)) throw new Error('Patch point tracker V5.3 berubah.');
    t=t.replace(trackerNeedle,trackerReplacement);

    const oldDetect="function detect(now){if(!handLandmarker||v.readyState<2||v.currentTime===lastVideoTime||now-lastDetect<18)return;lastVideoTime=v.currentTime;lastDetect=now;try{results=handLandmarker.detectForVideo(v,now);processHands(now)}catch(e){console.warn(e)}}";
    const newDetect="function detect(now){if(v.readyState<2)return;const fresh=v.currentTime!==lastVideoTime;if(fresh&&handLandmarker&&now-lastDetect>=18){lastVideoTime=v.currentTime;lastDetect=now;try{results=handLandmarker.detectForVideo(v,now);processHands(now)}catch(e){console.warn(e)}}if(fresh&&faceLandmarker&&now-lastFaceDetect>=34){lastFaceDetect=now;try{faceResults=faceLandmarker.detectForVideo(v,now);processFace(now)}catch(e){console.warn('face',e)}}updateWashGesture(now)}";
    if(!t.includes(oldDetect)) throw new Error('Patch point detect V5.3 berubah.');
    t=t.replace(oldDetect,newDetect);

    const faceCode="function facePt(face,id){return face?.[id]?mapScreen(face[id]):null}\nfunction facePathPoints(face){const ids=[10,338,297,332,284,251,389,356,454,323,361,397,379,400,152,176,150,136,172,132,93,234,127,162,54,103,67,109];return ids.map(i=>facePt(face,i)).filter(Boolean)}\nfunction processFace(now){const face=faceResults?.faceLandmarks?.[0];if(!face)return;const outline=facePathPoints(face);if(outline.length<10)return;const xs=outline.map(p=>p.x),ys=outline.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),w=maxX-minX,h=maxY-minY;const nose=facePt(face,1)||{x:(minX+maxX)/2,y:(minY+maxY)/2};const lcheek=facePt(face,234),rcheek=facePt(face,454),leye=facePt(face,33),reye=facePt(face,263),forehead=facePt(face,10),chin=facePt(face,152);const center={x:(minX+maxX)/2,y:(minY+maxY)/2};const cheekMid=lcheek&&rcheek?{x:(lcheek.x+rcheek.x)/2,y:(lcheek.y+rcheek.y)/2}:center;const yaw=Math.max(-1,Math.min(1,(nose.x-cheekMid.x)/Math.max(1,w*.18)));const eyeDx=(reye?.x||center.x)-(leye?.x||center.x),eyeDy=(reye?.y||center.y)-(leye?.y||center.y);const roll=Math.atan2(eyeDy,eyeDx);const pitch=Math.max(-1,Math.min(1,(nose.y-(forehead&&chin?(forehead.y+chin.y)/2:center.y))/Math.max(1,h*.16)));faceGeom={face,outline,minX,maxX,minY,maxY,w,h,center,nose,yaw,roll,pitch,t:now};lastFaceSeen=now}\nfunction palmCenters(){if(!results?.landmarks)return[];return results.landmarks.map((h,i)=>{const ids=[0,5,9,13,17],p=ids.map(j=>mapScreen(h[j]));return{x:p.reduce((s,q)=>s+q.x,0)/p.length,y:p.reduce((s,q)=>s+q.y,0)/p.length,i}}).sort((a,b)=>a.x-b.x)}\nfunction updateWashGesture(now){if(faceGeom&&now-lastFaceSeen>520)faceGeom=null;if(!faceGeom)return;const f=faceGeom,palms=palmCenters();\n  if(maskActive||maskDismissStart){washNearSince=0;washPrev=null;updateDismissGesture(now,palms);return}\n  if(palms.length<2){washNearSince=0;washPrev=null;return}\n  const ex=.38*f.w,ey=.30*f.h,inside=p=>p.x>f.minX-ex&&p.x<f.maxX+ex&&p.y>f.minY-ey&&p.y<f.maxY+ey;const both=inside(palms[0])&&inside(palms[1]);const split=palms[0].x<f.center.x&&palms[1].x>f.center.x;let moved=false;\n  if(washPrev){const dy=((washPrev[0].y-palms[0].y)+(washPrev[1].y-palms[1].y))/2;const oldDist=Math.abs(washPrev[1].x-washPrev[0].x),newDist=Math.abs(palms[1].x-palms[0].x);moved=Math.abs(dy)>.020*f.h||Math.abs(oldDist-newDist)>.040*f.w}\n  washPrev=palms.map(p=>({x:p.x,y:p.y}));\n  if(both&&split){if(!washNearSince)washNearSince=now;if(now-washNearSince>105&&moved&&now>washCooldown){maskActive=true;maskStart=now;maskProgress=0;dismissTrack=null;washCooldown=now+900}}\n  else washNearSince=0\n}\nfunction updateDismissGesture(now,palms){if(!faceGeom||!maskActive||maskDismissStart)return;const f=faceGeom;if(!palms.length){if(dismissTrack&&now-dismissTrack.t0>850)dismissTrack=null;return}\n  let p=palms.reduce((best,q)=>Math.abs(q.x-f.center.x)<Math.abs(best.x-f.center.x)?q:best,palms[0]);const inX=Math.abs(p.x-f.center.x)<f.w*.66;\n  if(!dismissTrack){if(inX&&p.y<f.minY+f.h*.18&&p.y>f.minY-f.h*.45)dismissTrack={i:p.i,t0:now,x0:p.x,y0:p.y,lastY:p.y};return}\n  if(now-dismissTrack.t0>900){dismissTrack=null;return}\n  if(p.i!==dismissTrack.i){const same=palms.find(q=>q.i===dismissTrack.i);if(same)p=same}\n  const downward=p.y-dismissTrack.y0;const sideDrift=Math.abs(p.x-dismissTrack.x0);if(p.y<dismissTrack.lastY-f.h*.08&&now-dismissTrack.t0>120){dismissTrack=null;return}dismissTrack.lastY=p.y;\n  if(downward>f.h*.48&&p.y>f.minY+f.h*.62&&sideDrift<f.w*.72){maskDismissStart=now;maskActive=false;maskProgress=1;dismissTrack=null;washCooldown=now+700}\n}\nfunction faceMaskPath(outline,scale=1.045){const f=faceGeom,c=f?.center||{x:0,y:0};ctx.beginPath();for(let i=0;i<outline.length;i++){const q={x:c.x+(outline[i].x-c.x)*scale,y:c.y+(outline[i].y-c.y)*scale};if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}ctx.closePath()}\nfunction eyeShape(face,ids,expand=1.15){const pts=ids.map(i=>facePt(face,i)).filter(Boolean);if(pts.length<3)return null;const c={x:pts.reduce((s,p)=>s+p.x,0)/pts.length,y:pts.reduce((s,p)=>s+p.y,0)/pts.length};return pts.map(p=>({x:c.x+(p.x-c.x)*expand,y:c.y+(p.y-c.y)*expand}))}\nfunction pathPoly(pts){if(!pts||pts.length<2)return;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath()}\nfunction drawTransfer(now){if(!faceGeom||maskActive||maskDismissStart)return;const palms=palmCenters();if(palms.length<2)return;const f=faceGeom,near=washNearSince?Math.min(1,(now-washNearSince)/220):0;if(near<=0)return;ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<2;i++){const p=palms[i],h=(now*.04+i*145)%360,g=ctx.createLinearGradient(p.x,p.y,f.center.x,f.center.y);g.addColorStop(0,`hsla(${h},100%,68%,${.72*near})`);g.addColorStop(.58,`hsla(${(h+85)%360},100%,78%,${.34*near})`);g.addColorStop(1,'rgba(255,255,255,.12)');ctx.strokeStyle=g;ctx.lineWidth=7*fx;ctx.shadowColor=`hsla(${h},100%,68%,1)`;ctx.shadowBlur=20*fx;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo((p.x+f.center.x)/2,f.center.y+(i?1:-1)*18,f.center.x,f.center.y);ctx.stroke()}ctx.restore()}\nfunction drawMaskLine(points,alpha,width=2,color='rgba(28,24,32,.78)'){const pts=points.map(i=>typeof i==='number'?facePt(faceGeom.face,i):i).filter(Boolean);if(pts.length<2)return;ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width*fx;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.restore()}\nfunction drawFaceMask(now){if(!faceGeom||(!maskActive&&!maskDismissStart))return;const f=faceGeom;let p=1,dismiss=0;if(maskActive){maskProgress=Math.min(1,(now-maskStart)/300);p=maskProgress}else if(maskDismissStart){dismiss=Math.min(1,(now-maskDismissStart)/maskDismissDuration);p=1;if(dismiss>=1){maskDismissStart=0;maskProgress=0;return}}\n  const hue=((now*.012)+(f.yaw*120)+(f.roll*70/Math.PI)+720)%360;const shellAlpha=(.88+.07*Math.cos(now*.004))*p;ctx.save();\n  if(dismiss>0){const wipeY=f.minY-f.h*.08+dismiss*f.h*1.18;ctx.beginPath();ctx.rect(f.minX-f.w*.25,wipeY,f.w*1.5,f.maxY-wipeY+f.h*.4);ctx.clip()}\n  ctx.save();ctx.globalCompositeOperation='source-over';ctx.shadowColor='rgba(0,0,0,.72)';ctx.shadowBlur=18*fx;ctx.shadowOffsetY=7*fx;faceMaskPath(f.outline,1.055);ctx.fillStyle=`rgba(238,239,244,${.78*shellAlpha})`;ctx.fill();ctx.restore();\n  ctx.save();ctx.globalCompositeOperation='screen';faceMaskPath(f.outline,1.045);const g=ctx.createLinearGradient(f.minX,f.minY,f.maxX,f.maxY);g.addColorStop(0,`rgba(255,255,255,${.90*shellAlpha})`);g.addColorStop(.28,`rgba(214,218,228,${.68*shellAlpha})`);g.addColorStop(.55,`hsla(${hue},100%,88%,${.18*shellAlpha})`);g.addColorStop(.78,`rgba(248,248,252,${.82*shellAlpha})`);g.addColorStop(1,`hsla(${(hue+115)%360},100%,78%,${.22*shellAlpha})`);ctx.fillStyle=g;ctx.fill();ctx.restore();\n  const LE=eyeShape(f.face,[33,160,158,133,153,144],1.34),RE=eyeShape(f.face,[362,385,387,263,373,380],1.34);for(const e of [LE,RE])if(e){ctx.save();pathPoly(e);ctx.fillStyle=`rgba(12,10,16,${.88*p})`;ctx.shadowColor=`hsla(${hue},100%,65%,.35)`;ctx.shadowBlur=8*fx;ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${.55*p})`;ctx.lineWidth=1.1*fx;ctx.stroke();ctx.restore()}\n  drawMaskLine([70,63,105,66],p,2.4,'rgba(35,29,40,.82)');drawMaskLine([296,334,293,300],p,2.4,'rgba(35,29,40,.82)');\n  drawMaskLine([168,6,197,5,4,1],p,2.0,'rgba(78,72,86,.58)');\n  const nL=facePt(f.face,98),nR=facePt(f.face,327),nose=facePt(f.face,1);if(nL&&nR&&nose){ctx.save();ctx.globalAlpha=.55*p;ctx.strokeStyle='rgba(45,38,50,.72)';ctx.lineWidth=1.8*fx;ctx.beginPath();ctx.moveTo(nL.x,nL.y);ctx.quadraticCurveTo(nose.x,nose.y+f.h*.045,nR.x,nR.y);ctx.stroke();ctx.restore()}\n  const ml=facePt(f.face,61),mr=facePt(f.face,291),mc=facePt(f.face,13),lower=facePt(f.face,14),chin=facePt(f.face,152);if(ml&&mr&&mc){ctx.save();ctx.globalAlpha=.86*p;ctx.strokeStyle='rgba(25,20,29,.84)';ctx.lineWidth=2.5*fx;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(mc.x,mc.y-f.h*.015);ctx.bezierCurveTo(mc.x-f.w*.06,mc.y-f.h*.055,ml.x+f.w*.04,ml.y-f.h*.035,ml.x-f.w*.015,ml.y-f.h*.065);ctx.moveTo(mc.x,mc.y-f.h*.015);ctx.bezierCurveTo(mc.x+f.w*.06,mc.y-f.h*.055,mr.x-f.w*.04,mr.y-f.h*.035,mr.x+f.w*.015,mr.y-f.h*.065);ctx.stroke();ctx.restore();ctx.save();ctx.globalAlpha=.75*p;ctx.strokeStyle='rgba(45,37,49,.78)';ctx.lineWidth=2.2*fx;ctx.beginPath();ctx.moveTo(ml.x,ml.y);ctx.quadraticCurveTo(mc.x,(lower?.y||mc.y)+f.h*.035,mr.x,mr.y);ctx.stroke();ctx.restore()}\n  if(lower&&chin){ctx.save();ctx.globalAlpha=.55*p;ctx.strokeStyle='rgba(45,37,49,.70)';ctx.lineWidth=1.9*fx;ctx.beginPath();ctx.moveTo(lower.x,lower.y+f.h*.018);ctx.quadraticCurveTo(lower.x,lower.y+f.h*.075,chin.x,chin.y-f.h*.055);ctx.stroke();ctx.restore()}\n  drawMaskLine([234,93,132,58],.48*p,1.7,'rgba(92,86,102,.52)');drawMaskLine([454,323,361,288],.48*p,1.7,'rgba(92,86,102,.52)');\n  ctx.save();ctx.globalCompositeOperation='screen';faceMaskPath(f.outline,1.05);ctx.shadowColor=`hsla(${hue},100%,63%,.95)`;ctx.shadowBlur=16*fx;ctx.strokeStyle=`hsla(${hue},100%,67%,${.65*p})`;ctx.lineWidth=4.4*fx;ctx.stroke();ctx.shadowBlur=3*fx;ctx.strokeStyle=`rgba(255,255,255,${.88*p})`;ctx.lineWidth=1.3*fx;ctx.stroke();ctx.restore();\n  ctx.save();faceMaskPath(f.outline,1.04);ctx.clip();ctx.globalCompositeOperation='screen';const sx=f.center.x+f.yaw*f.w*.22,sh=ctx.createLinearGradient(sx-f.w*.35,f.minY,sx+f.w*.35,f.maxY);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.42,`hsla(${hue},100%,76%,0)`);sh.addColorStop(.50,`hsla(${hue},100%,78%,${.30*p})`);sh.addColorStop(.58,`hsla(${(hue+130)%360},100%,74%,${.20*p})`);sh.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sh;ctx.fillRect(f.minX-f.w*.2,f.minY,f.w*1.4,f.h);ctx.restore();\n  if(dismiss>0){const wipeY=f.minY-f.h*.08+dismiss*f.h*1.18;ctx.save();ctx.globalCompositeOperation='screen';const lg=ctx.createLinearGradient(f.minX,wipeY,f.maxX,wipeY);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.25,`hsla(${hue},100%,72%,.8)`);lg.addColorStop(.5,'rgba(255,255,255,.95)');lg.addColorStop(.75,`hsla(${(hue+120)%360},100%,72%,.8)`);lg.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=lg;ctx.lineWidth=3*fx;ctx.shadowColor='white';ctx.shadowBlur=12*fx;ctx.beginPath();ctx.moveTo(f.minX-f.w*.08,wipeY);ctx.lineTo(f.maxX+f.w*.08,wipeY);ctx.stroke();ctx.restore()}\n  ctx.restore()\n}\nfunction drawFaceDebug(){if(!debug||!faceGeom)return;const f=faceGeom;ctx.save();ctx.strokeStyle='#67f7ff';ctx.lineWidth=1;ctx.strokeRect(f.minX,f.minY,f.w,f.h);ctx.fillStyle='#fff';ctx.font='15px ui-monospace,monospace';ctx.fillText('FACE yaw '+f.yaw.toFixed(2)+' roll '+(f.roll*180/Math.PI).toFixed(0)+'°',Math.max(8,f.minX),Math.max(22,f.minY-8));const state=maskDismissStart?'MASK WIPE OFF':maskActive?(dismissTrack?'SWIPE DOWN READY':'MASK ACTIVE'):(washNearSince?'SUMMONING':'WASH READY');ctx.fillText(state,Math.max(8,f.minX),Math.min(H-12,f.maxY+22));ctx.restore()}\nfunction drawFaceFX(now){drawTransfer(now);drawFaceMask(now);drawFaceDebug()}";

    if(!t.includes('function drawMesh(now){')) throw new Error('Patch point drawMesh V5.3 berubah.');
    t=t.replace('function drawMesh(now){',faceCode+'\nfunction drawMesh(now){drawFaceFX(now);');

    t=t.replace("motion.clear();fingerState.clear();try{await openCamera()}","motion.clear();fingerState.clear();faceGeom=null;faceResults=null;maskActive=false;maskDismissStart=0;dismissTrack=null;washNearSince=0;try{await openCamera()}");

    document.open();document.write(t);document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div class="boot"><div class="box"><h2>V6.1 gagal boot</h2><p>'+String(e.message||e)+'</p><small>Coba refresh halaman HTTPS ini.</small></div></div>';
  }
})();
</script></body></html>
