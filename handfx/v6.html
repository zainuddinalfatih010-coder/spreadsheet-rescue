<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050508"><title>HAND//FX V6 Loader</title><style>html,body{margin:0;height:100%;background:#050508;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:26px}.box{max-width:380px}.spin{font-size:42px;animation:p 1s ease-in-out infinite alternate}@keyframes p{to{transform:scale(1.15);filter:drop-shadow(0 0 16px #b86cff)}}small{color:#aaa}</style></head>
<body><div class="boot"><div class="box"><div class="spin">✦</div><h2>HAND//FX V6</h2><p>Loading hand + face transformation engine…</p><small>HTTPS runtime</small></div></div><script>
(async()=>{try{
let t=await (await fetch('./v5-3.html?v=6',{cache:'no-store'})).text();
if(!t.includes('HAND//FX V5.3'))throw new Error('Baseline V5.3 gagal dimuat.');
t=t.replaceAll('HAND//FX V5.3','HAND//FX V6').replaceAll('· V5.3','· V6');
t=t.replace('Semi-bent fingers · stable topology · low latency','Hand mesh + Wash Mask · angle-reactive inversion');
t=t.replace('Jari lurus maupun sedikit menekuk tetap bisa jadi vertex; jari yang benar-benar menggenggam baru dibuang. Mesh tetap tajam dan low-latency.','V5.3 hand mesh tetap dipertahankan. Sekarang ada face mesh, Wash-to-Mask, iridescent material, dan angle-reactive inversion.');
t=t.replace("const W=720,H=1280,MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';","const W=720,H=1280,MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',FACE_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';");
t=t.replace("let stream=null,facing='user',running=false,handLandmarker=null,results=null,FilesetResolver=null,HandLandmarker=null;","let stream=null,facing='user',running=false,handLandmarker=null,faceLandmarker=null,results=null,faceResults=null,FilesetResolver=null,HandLandmarker=null,FaceLandmarker=null;");
t=t.replace("let lastVideoTime=-1,lastDetect=0,debug=false,fx=1,actualCamFps='?',renderFps=0,rafCount=0,rafWindow=performance.now();","let lastVideoTime=-1,lastDetect=0,lastFaceDetect=0,debug=false,fx=1,actualCamFps='?',renderFps=0,rafCount=0,rafWindow=performance.now();");
t=t.replace("let trackedHands=[],motion=new Map(),fingerState=new Map();","let trackedHands=[],motion=new Map(),fingerState=new Map(),faceGeom=null,lastFaceSeen=0,maskActive=false,maskStart=0,maskProgress=0,washNearSince=0,washCooldown=0,washPrev=null,faceTrackerError='';");
t=t.replace("FilesetResolver=mod.FilesetResolver;HandLandmarker=mod.HandLandmarker;","FilesetResolver=mod.FilesetResolver;HandLandmarker=mod.HandLandmarker;FaceLandmarker=mod.FaceLandmarker;");
const trackerNeedle="try{handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}catch(e){opts.baseOptions.delegate='CPU';handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}setStatus(`Tracker siap · ${actualCamFps}fps cam`,true);diagnostic('state: tracker ready')";
const trackerReplacement="try{handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}catch(e){opts.baseOptions.delegate='CPU';handLandmarker=await HandLandmarker.createFromOptions(vision,opts)}try{const fopts={baseOptions:{modelAssetPath:FACE_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45,outputFaceBlendshapes:false,outputFacialTransformationMatrixes:false};try{faceLandmarker=await FaceLandmarker.createFromOptions(vision,fopts)}catch(fe){fopts.baseOptions.delegate='CPU';faceLandmarker=await FaceLandmarker.createFromOptions(vision,fopts)}}catch(fe){faceTrackerError=fe?.message||String(fe);console.warn('Face tracker unavailable',fe)}setStatus(faceLandmarker?`Hand + face siap · ${actualCamFps}fps cam`:`Hand siap · face gagal`,true);diagnostic(faceLandmarker?'state: hand + face tracker ready':'FACE ERROR: '+faceTrackerError)";
if(!t.includes(trackerNeedle))throw new Error('Patch point tracker V5.3 berubah.');t=t.replace(trackerNeedle,trackerReplacement);
const oldDetect="function detect(now){if(!handLandmarker||v.readyState<2||v.currentTime===lastVideoTime||now-lastDetect<18)return;lastVideoTime=v.currentTime;lastDetect=now;try{results=handLandmarker.detectForVideo(v,now);processHands(now)}catch(e){console.warn(e)}}";
const newDetect="function detect(now){if(v.readyState<2)return;const fresh=v.currentTime!==lastVideoTime;if(fresh&&handLandmarker&&now-lastDetect>=18){lastVideoTime=v.currentTime;lastDetect=now;try{results=handLandmarker.detectForVideo(v,now);processHands(now)}catch(e){console.warn(e)}}if(fresh&&faceLandmarker&&now-lastFaceDetect>=34){lastFaceDetect=now;try{faceResults=faceLandmarker.detectForVideo(v,now);processFace(now)}catch(e){console.warn('face',e)}}updateWashGesture(now)}";
if(!t.includes(oldDetect))throw new Error('Patch point detect V5.3 berubah.');t=t.replace(oldDetect,newDetect);
const faceCode="\nfunction facePt(face,id){return face?.[id]?mapScreen(face[id]):null}\nfunction facePathPoints(face){const ids=[10,338,297,332,284,251,389,356,454,323,361,397,379,400,152,176,150,136,172,132,93,234,127,162,54,103,67,109];return ids.map(i=>facePt(face,i)).filter(Boolean)}\nfunction processFace(now){const face=faceResults?.faceLandmarks?.[0];if(!face)return;const outline=facePathPoints(face);if(outline.length<10)return;const xs=outline.map(p=>p.x),ys=outline.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),w=maxX-minX,h=maxY-minY;const nose=facePt(face,1)||{x:(minX+maxX)/2,y:(minY+maxY)/2};const lcheek=facePt(face,234),rcheek=facePt(face,454),leye=facePt(face,33),reye=facePt(face,263),forehead=facePt(face,10),chin=facePt(face,152);const center={x:(minX+maxX)/2,y:(minY+maxY)/2};const cheekMid=lcheek&&rcheek?{x:(lcheek.x+rcheek.x)/2,y:(lcheek.y+rcheek.y)/2}:center;const yaw=Math.max(-1,Math.min(1,(nose.x-cheekMid.x)/Math.max(1,w*.18)));const eyeDx=(reye?.x||center.x)-(leye?.x||center.x),eyeDy=(reye?.y||center.y)-(leye?.y||center.y);const roll=Math.atan2(eyeDy,eyeDx);const pitch=Math.max(-1,Math.min(1,(nose.y-(forehead&&chin?(forehead.y+chin.y)/2:center.y))/Math.max(1,h*.16)));faceGeom={face,outline,minX,maxX,minY,maxY,w,h,center,nose,yaw,roll,pitch,t:now};lastFaceSeen=now}\nfunction palmCenters(){if(!results?.landmarks)return[];return results.landmarks.map((h,i)=>{const ids=[0,5,9,13,17],p=ids.map(j=>mapScreen(h[j]));return{x:p.reduce((s,q)=>s+q.x,0)/p.length,y:p.reduce((s,q)=>s+q.y,0)/p.length,i}}).sort((a,b)=>a.x-b.x)}\nfunction updateWashGesture(now){if(faceGeom&&now-lastFaceSeen>520)faceGeom=null;if(!faceGeom)return;const palms=palmCenters();if(palms.length<2){washNearSince=0;washPrev=null;return}const f=faceGeom,ex=.35*f.w,ey=.28*f.h,inside=p=>p.x>f.minX-ex&&p.x<f.maxX+ex&&p.y>f.minY-ey&&p.y<f.maxY+ey;const both=inside(palms[0])&&inside(palms[1]);const split=palms[0].x<f.center.x&&palms[1].x>f.center.x;let moved=false;if(washPrev){const dy=((washPrev[0].y-palms[0].y)+(washPrev[1].y-palms[1].y))/2;const oldDist=Math.abs(washPrev[1].x-washPrev[0].x),newDist=Math.abs(palms[1].x-palms[0].x);moved=Math.abs(dy)>.025*f.h||Math.abs(oldDist-newDist)>.045*f.w}washPrev=palms.map(p=>({x:p.x,y:p.y}));if(both&&split){if(!washNearSince)washNearSince=now;if(now-washNearSince>110&&moved&&now>washCooldown&&!maskActive){maskActive=true;maskStart=now;maskProgress=0;washCooldown=now+1200}}else washNearSince=0}\nfunction faceMaskPath(outline){ctx.beginPath();ctx.moveTo(outline[0].x,outline[0].y);for(let i=1;i<outline.length;i++)ctx.lineTo(outline[i].x,outline[i].y);ctx.closePath()}\nfunction drawTransfer(now){if(!faceGeom)return;const palms=palmCenters();if(palms.length<2)return;const f=faceGeom,near=washNearSince?Math.min(1,(now-washNearSince)/220):0;if(near<=0)return;ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<2;i++){const p=palms[i],h=(now*.04+i*145)%360,g=ctx.createLinearGradient(p.x,p.y,f.center.x,f.center.y);g.addColorStop(0,`hsla(${h},100%,65%,${.75*near})`);g.addColorStop(.55,`hsla(${(h+80)%360},100%,72%,${.38*near})`);g.addColorStop(1,'rgba(255,255,255,.15)');ctx.strokeStyle=g;ctx.lineWidth=8*fx;ctx.shadowColor=`hsla(${h},100%,65%,1)`;ctx.shadowBlur=25*fx;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo((p.x+f.center.x)/2,f.center.y+(i?1:-1)*22,f.center.x,f.center.y);ctx.stroke()}ctx.restore()}\nfunction drawFaceMask(now){if(!faceGeom||(!maskActive&&washNearSince===0))return;const f=faceGeom;if(maskActive)maskProgress=Math.min(1,(now-maskStart)/320);const p=maskActive?maskProgress:Math.min(.22,(now-washNearSince)/800);const hue=((now*.018)+(f.yaw*155)+(f.roll*90/Math.PI)+720)%360;const inv=Math.min(.88,.12+Math.abs(f.yaw)*.55+Math.abs(f.roll)*.28);ctx.save();faceMaskPath(f.outline);ctx.clip();ctx.globalCompositeOperation='difference';ctx.globalAlpha=inv*p;ctx.fillStyle='#fff';ctx.fillRect(f.minX-10,f.minY-10,f.w+20,f.h+20);ctx.globalAlpha=1;ctx.globalCompositeOperation='screen';const rg=ctx.createRadialGradient(f.nose.x,f.nose.y,0,f.center.x,f.center.y,Math.max(f.w,f.h)*.72);rg.addColorStop(0,`hsla(${(hue+65)%360},100%,75%,${.22*p})`);rg.addColorStop(.45,`hsla(${hue},100%,58%,${.33*p})`);rg.addColorStop(1,`hsla(${(hue+190)%360},100%,56%,${.42*p})`);ctx.fillStyle=rg;ctx.fillRect(f.minX-20,f.minY-20,f.w+40,f.h+40);const stride=3;for(let i=0;i<f.outline.length;i+=stride){const a=f.outline[i],b=f.outline[(i+stride)%f.outline.length];ctx.strokeStyle=`hsla(${(hue+i*17)%360},100%,78%,${.28*p})`;ctx.lineWidth=1.15*fx;ctx.beginPath();ctx.moveTo(f.nose.x,f.nose.y);ctx.lineTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.restore();ctx.save();ctx.globalCompositeOperation='screen';ctx.lineJoin='round';faceMaskPath(f.outline);ctx.shadowColor=`hsla(${hue},100%,62%,1)`;ctx.shadowBlur=28*fx*p;ctx.strokeStyle=`hsla(${hue},100%,62%,${.95*p})`;ctx.lineWidth=7*fx;ctx.stroke();ctx.shadowBlur=5*fx;ctx.strokeStyle=`rgba(255,255,255,${.96*p})`;ctx.lineWidth=1.7*fx;ctx.stroke();const eyeA=facePt(f.face,33),eyeB=facePt(f.face,263);if(eyeA&&eyeB){for(const e of [eyeA,eyeB]){const gr=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,22*fx);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.25,`hsla(${(hue+110)%360},100%,72%,.85)`);gr.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(e.x,e.y,22*fx*p,0,Math.PI*2);ctx.fill()}}ctx.restore()}\nfunction drawFaceDebug(){if(!debug||!faceGeom)return;const f=faceGeom;ctx.save();ctx.strokeStyle='#67f7ff';ctx.lineWidth=1;ctx.strokeRect(f.minX,f.minY,f.w,f.h);ctx.fillStyle='#fff';ctx.font='15px ui-monospace,monospace';ctx.fillText('FACE yaw '+f.yaw.toFixed(2)+' roll '+(f.roll*180/Math.PI).toFixed(0)+'°',Math.max(8,f.minX),Math.max(22,f.minY-8));ctx.fillText(maskActive?'MASK ACTIVE':'WASH READY',Math.max(8,f.minX),Math.min(H-12,f.maxY+22));ctx.restore()}\nfunction drawFaceFX(now){drawTransfer(now);drawFaceMask(now);drawFaceDebug()}\n";
if(!t.includes('function drawMesh(now){'))throw new Error('Patch point drawMesh V5.3 berubah.');
t=t.replace('function drawMesh(now){',faceCode+'\nfunction drawMesh(now){drawFaceFX(now);');
t=t.replace("motion.clear();fingerState.clear();try{await openCamera()}","motion.clear();fingerState.clear();faceGeom=null;faceResults=null;maskActive=false;washNearSince=0;try{await openCamera()}");
document.open();document.write(t);document.close();
}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><div class="box"><h2>V6 gagal boot</h2><p>'+String(e.message||e)+'</p><small>Coba refresh halaman HTTPS ini.</small></div></div>'}})();
</script></body></html>
