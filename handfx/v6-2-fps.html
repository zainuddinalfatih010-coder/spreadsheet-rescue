<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050508">
<title>HAND//FX FPS Camera Lab</title>
<style>
html,body{margin:0;height:100%;background:#050508;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.boot{height:100dvh;display:grid;place-items:center;text-align:center;padding:26px}.box{max-width:390px}.spin{font-size:42px;animation:p .8s ease-in-out infinite alternate}@keyframes p{to{transform:scale(1.16);filter:drop-shadow(0 0 18px #74e6ff)}}small{color:#999}
</style></head>
<body><div class="boot"><div class="box"><div class="spin">✦</div><h2>HAND//FX CAMERA LAB</h2><p>Loading real FPS camera controls…</p><small>60 FPS preferred · measured live</small></div></div>
<script>
(async()=>{
try{
  let s=await (await fetch('./v6-2.html?v=fpscam1',{cache:'no-store'})).text();
  if(!s.includes('HAND//FX V6.2')) throw new Error('Baseline V6.2 gagal dimuat.');

  const marker='    document.open();document.write(t);document.close();';
  if(!s.includes(marker)) throw new Error('Patch point V6.2 tidak ditemukan.');

  const fpsPatch=String.raw`
    t=t.replaceAll('HAND//FX V6.2','HAND//FX CAM');
    t=t.replaceAll('· V6.2','· CAM');
    t=t.replace('</style>', '.topBtns{display:flex;gap:8px}.camfps{width:auto!important;min-width:66px;padding:0 10px;font-size:12px;font-weight:900}.camSheet{position:absolute;z-index:30;inset:0;background:#050508aa;backdrop-filter:blur(8px);display:flex;align-items:flex-end}.camSheet.hidden{display:none}.camPanel{width:100%;padding:18px 16px max(22px,env(safe-area-inset-bottom));background:#101017;border:1px solid #ffffff22;border-radius:24px 24px 0 0;box-shadow:0 -18px 50px #0008}.camHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.camHead b{font-size:18px}.camClose{border:0;background:#ffffff12;color:white;border-radius:999px;width:38px;height:38px;font-size:20px}.fpsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.fpsOpt{height:52px;border-radius:14px;border:1px solid #ffffff20;background:#171722;color:#fff;font-weight:900;font-size:14px}.fpsOpt.active{background:#f5f5fa;color:#09090d;border-color:#fff}.fpsOpt:disabled{opacity:.28}.camInfo{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-line;line-height:1.55;color:#b9bac6;background:#09090d;border:1px solid #ffffff12;border-radius:14px;padding:11px}.camNote{font-size:11px;line-height:1.45;color:#898a96;margin:10px 2px 0}</style>');
    t=t.replace('<button id="flip" class="btn">↻</button></div>', '<div class="topBtns"><button id="camset" class="btn camfps">60 FPS</button><button id="flip" class="btn">↻</button></div></div>');
    t=t.replace('</main>', '<div id="camSheet" class="camSheet hidden"><div class="camPanel"><div class="camHead"><b>Camera FPS</b><button id="camClose" class="camClose">×</button></div><div id="fpsGrid" class="fpsGrid"></div><div id="camInfo" class="camInfo">Camera belum aktif.</div><div class="camNote">60 FPS dipaksa lewat camera track, lalu dicek lagi dari setting stream dan frame yang benar-benar tiba. Kalau mode ditolak browser/driver, HAND//FX tidak akan pura-pura bilang 60.</div></div></div></main>');
    t=t.replace(",rec=$('#rec');", ",rec=$('#rec'),camSetBtn=$('#camset'),camSheet=$('#camSheet'),camClose=$('#camClose'),fpsGrid=$('#fpsGrid'),camInfo=$('#camInfo');");
    t=t.replace('let trackedHands=[],motion=new Map(),fingerState=new Map()', "let cameraFpsTarget=Number(localStorage.getItem('handfx-fps')||60),cameraCaps=null,measuredCamFps=0,camMeterFrames=0,camMeterStart=0,camMeterToken=0,cameraModeWarning='',rafLoopStarted=false;\nlet trackedHands=[],motion=new Map(),fingerState=new Map()");
    t=t.replace('requested camera: 60 fps', 'requested camera: ${cameraFpsTarget===0?\'AUTO\':cameraFpsTarget+\' fps\'}');
    t=t.replace('actual camera: ${actualCamFps} fps', 'configured camera: ${actualCamFps} fps\\nmeasured camera: ${measuredCamFps||\'?\'} fps');
    t=t.replace('function stopCamera(){', "function cameraFpsConstraint(){return cameraFpsTarget===0?{ideal:60}:{ideal:cameraFpsTarget,max:cameraFpsTarget}}\nfunction updateCameraPanel(){if(!camSetBtn)return;camSetBtn.textContent=(cameraFpsTarget===0?'AUTO':cameraFpsTarget+' FPS');if(!fpsGrid||!camInfo)return;const cap=cameraCaps&&cameraCaps.frameRate?cameraCaps.frameRate:null;const choices=[0,24,30,60,90,120];fpsGrid.innerHTML='';for(const f of choices){const b=document.createElement('button');b.className='fpsOpt'+(f===cameraFpsTarget?' active':'');b.textContent=f===0?'AUTO':f+' FPS';if(f&&cap&&Number.isFinite(cap.max)&&f>cap.max+.5)b.disabled=true;b.addEventListener('click',()=>setCameraFps(f));fpsGrid.appendChild(b)}const range=cap?(Number(cap.min||0).toFixed(0)+'–'+Number(cap.max||0).toFixed(0)+' fps'):'belum diketahui';camInfo.textContent='Browser camera range: '+range+'\\nConfigured stream: '+actualCamFps+' fps\\nDelivered frames: '+(measuredCamFps||'…')+' fps'+(cameraModeWarning?'\\n⚠ '+cameraModeWarning:'')} }\nfunction startCameraFrameMeter(){camMeterToken++;const token=camMeterToken;measuredCamFps=0;camMeterFrames=0;camMeterStart=performance.now();if(!v.requestVideoFrameCallback){cameraModeWarning='requestVideoFrameCallback tidak tersedia; hanya configured FPS yang bisa dibaca';updateCameraPanel();return}const tick=(now)=>{if(token!==camMeterToken||!stream)return;camMeterFrames++;const dt=now-camMeterStart;if(dt>=900){measuredCamFps=Math.round(camMeterFrames*1000/dt);camMeterFrames=0;camMeterStart=now;updateCameraPanel()}v.requestVideoFrameCallback(tick)};v.requestVideoFrameCallback(tick)}\nasync function setCameraFps(fps){const old=cameraFpsTarget;cameraFpsTarget=Number(fps)||0;localStorage.setItem('handfx-fps',String(cameraFpsTarget));cameraModeWarning='';updateCameraPanel();const tr=stream&&stream.getVideoTracks?stream.getVideoTracks()[0]:null;if(!tr)return;setStatus('Mengubah kamera ke '+(cameraFpsTarget===0?'AUTO':cameraFpsTarget+'fps')+'…');try{if(cameraFpsTarget===0)await tr.applyConstraints({frameRate:{ideal:60}});else await tr.applyConstraints({frameRate:{exact:cameraFpsTarget}});const st=tr.getSettings?tr.getSettings():{};actualCamFps=st.frameRate||'?';cameraCaps=tr.getCapabilities?tr.getCapabilities():cameraCaps;cameraModeWarning='';startCameraFrameMeter();setStatus('Camera '+actualCamFps+'fps configured',true)}catch(e){cameraModeWarning=(cameraFpsTarget===0?'AUTO':cameraFpsTarget+' FPS')+' tidak tersedia pada mode kamera ini';cameraFpsTarget=old;localStorage.setItem('handfx-fps',String(cameraFpsTarget));setStatus(cameraModeWarning);console.warn('FPS switch',e)}updateCameraPanel();diagnostic(cameraModeWarning||'camera FPS mode applied')}\nfunction stopCamera(){camMeterToken++;");
    t=t.replace('frameRate:{ideal:60,max:60}', 'frameRate:cameraFpsConstraint()');
    t=t.replace("const tr=stream.getVideoTracks()[0],s=tr.getSettings?.()||{};actualCamFps=s.frameRate||'?';", "const tr=stream.getVideoTracks()[0];cameraCaps=tr.getCapabilities?tr.getCapabilities():null;cameraModeWarning='';if(cameraFpsTarget!==0){try{await tr.applyConstraints({frameRate:{exact:cameraFpsTarget}})}catch(e){cameraModeWarning=cameraFpsTarget+' FPS exact ditolak; browser memberi mode terdekat'}}const s=tr.getSettings?.()||{};actualCamFps=s.frameRate||'?';");
    t=t.replace('v.srcObject=stream;await v.play();overlay.classList.add', 'v.srcObject=stream;await v.play();startCameraFrameMeter();updateCameraPanel();overlay.classList.add');
    t=t.replace('diagnostic(\'state: camera running\');requestAnimationFrame(loop)', "diagnostic(cameraModeWarning||'state: camera running');if(!rafLoopStarted){rafLoopStarted=true;requestAnimationFrame(loop)}");
    t=t.replace('cam ${actualCamFps}fps · render', 'cam ${measuredCamFps||actualCamFps}fps · render');
    t=t.replace("debugBtn.addEventListener('click'", "camSetBtn.addEventListener('click',()=>{updateCameraPanel();camSheet.classList.remove('hidden')});camClose.addEventListener('click',()=>camSheet.classList.add('hidden'));camSheet.addEventListener('click',e=>{if(e.target===camSheet)camSheet.classList.add('hidden')});updateCameraPanel();\ndebugBtn.addEventListener('click'");
  `;

  s=s.replace(marker,fpsPatch+'\n'+marker)
     .replace('<title>HAND//FX V6.2 Loader</title>','<title>HAND//FX Camera FPS Loader</title>')
     .replace('<h2>HAND//FX V6.2</h2>','<h2>HAND//FX CAMERA FPS</h2>')
     .replace('Loading material + preset engine…','Loading real camera FPS controls…');

  document.open();document.write(s);document.close();
}catch(e){
  console.error(e);
  document.body.innerHTML='<div class="boot"><div class="box"><h2>CAMERA LAB gagal boot</h2><p>'+String(e.message||e)+'</p><small>Refresh halaman HTTPS ini.</small></div></div>';
}
})();
</script></body></html>
