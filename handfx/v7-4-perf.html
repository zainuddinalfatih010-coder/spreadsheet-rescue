function spellHandState(h,i){const th=trackedHands[i];if(!th)return null;const open=th.states.filter(s=>s.open).length;if(open<4)return null;const ids=[0,5,9,13,17],ps=ids.map(j=>mapScreen(h[j])),cc={x:ps.reduce((a,p)=>a+p.x,0)/5,y:ps.reduce((a,p)=>a+p.y,0)/5},pw=Math.hypot(ps[4].x-ps[1].x,ps[4].y-ps[1].y),ph=Math.hypot(ps[2].x-ps[0].x,ps[2].y-ps[0].y),r=Math.max(62,Math.min(145,pw*1.08+ph*.55)),angle=Math.atan2(ps[4].y-ps[1].y,ps[4].x-ps[1].x),side=Math.abs((h[5].z||0)-(h[17].z||0)),squash=Math.max(.62,Math.min(1,1-side*4));return{c:cc,r,angle,squash}}
const ORANGE='#ff6a00',GOLD='#ff9a1f',PALE='#fff1cc';
function circleStroke(r,w,color,a=1){ctx.globalAlpha=a;ctx.lineWidth=w;ctx.strokeStyle=color;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke()}
function drawSpellCircle(st,now,idx){const r=st.r;ctx.save();ctx.globalCompositeOperation='screen';ctx.translate(st.c.x,st.c.y);ctx.rotate(st.angle);ctx.scale(1,st.squash);for(const [rr,w,a] of [[r,11,.10],[r,5,.28],[r,2.2,.92]])circleStroke(rr,w,ORANGE,a);circleStroke(r*.93,1.2,PALE,.92);for(let ring=0;ring<2;ring++){ctx.save();ctx.rotate((ring?-.0013:.0018)*now+idx*.5);ctx.lineWidth=1.5;ctx.strokeStyle=ring?GOLD:ORANGE;ctx.globalAlpha=.78;const rr=r*(.74-ring*.15);for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.arc(0,0,rr,a,a+.48);ctx.stroke()}ctx.restore()}ctx.save();ctx.rotate(-now*.0015);for(let k=0;k<16;k++){const a=k*Math.PI/8,ri=r*(k%4===0?.66:.70),ro=r*(k%4===0?.84:.78);ctx.lineWidth=k%4===0?1.8:.9;ctx.strokeStyle=k%4===0?PALE:GOLD;ctx.globalAlpha=k%4===0?.82:.55;ctx.beginPath();ctx.moveTo(Math.cos(a)*ri,Math.sin(a)*ri);ctx.lineTo(Math.cos(a)*ro,Math.sin(a)*ro);ctx.stroke()}ctx.restore();ctx.save();ctx.rotate(now*.0011);ctx.strokeStyle=GOLD;ctx.globalAlpha=.78;ctx.lineWidth=1.3;ctx.beginPath();for(let k=0;k<8;k++){const a=-Math.PI/2+k*Math.PI/4,rr=k%2===0?r*.42:r*.19,x=Math.cos(a)*rr,y=Math.sin(a)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();circleStroke(r*.16,1.1,PALE,.86);ctx.restore();ctx.save();ctx.rotate(-now*.0017);for(let k=0;k<8;k++){const a=k*Math.PI/4,x=Math.cos(a)*r*.56,y=Math.sin(a)*r*.56,s=r*.035;ctx.translate(x,y);ctx.rotate(a+Math.PI/4);ctx.strokeStyle=PALE;ctx.globalAlpha=.68;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.7,0);ctx.lineTo(0,s);ctx.lineTo(-s*.7,0);ctx.closePath();ctx.stroke();ctx.rotate(-(a+Math.PI/4));ctx.translate(-x,-y)}ctx.restore();for(let k=0;k<8;k++){const a=now*.0025+k*2.399+idx*.5,rr=r*(.92+.08*Math.sin(k+now*.003)),x=Math.cos(a)*rr,y=Math.sin(a)*rr,len=r*.055;ctx.strokeStyle=k%3===0?PALE:ORANGE;ctx.globalAlpha=.36+.25*Math.sin(now*.004+k);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a+.5)*len,y+Math.sin(a+.5)*len);ctx.stroke()}ctx.restore()}
function drawDual(a,bb,now){const mx=(a.c.x+bb.c.x)/2,my=(a.c.y+bb.c.y)/2,d=Math.hypot(bb.c.x-a.c.x,bb.c.y-a.c.y);ctx.save();ctx.globalCompositeOperation='screen';const g=ctx.createLinearGradient(a.c.x,a.c.y,bb.c.x,bb.c.y);g.addColorStop(0,'rgba(255,106,0,0)');g.addColorStop(.5,'rgba(255,180,72,.68)');g.addColorStop(1,'rgba(255,106,0,0)');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.c.x,a.c.y);ctx.quadraticCurveTo(mx,my-Math.min(55,d*.12),bb.c.x,bb.c.y);ctx.stroke();ctx.translate(mx,my);ctx.rotate(now*.002);circleStroke(Math.max(14,Math.min(30,d*.06)),1.2,GOLD,.78);ctx.restore()}
function drawSpell(now){const hs=results?.landmarks||[],states=[];for(let i=0;i<Math.min(2,hs.length);i++){const st=spellHandState(hs[i],i);if(st)states.push(st)}for(let i=0;i<states.length;i++)drawSpellCircle(states[i],now,i);if(states.length>=2)drawDual(states[0],states[1],now)}
function drawDebug(now){if(!debug)return;debugPanel.style.display='block';debugPanel.textContent=`render ${renderFps.toFixed(0)} fps\ndetect ${detectFps.toFixed(0)} fps\ncanvas ${W}x${H}\nhands ${results?.landmarks?.length||0}\nspell ${spellMode?'ON':'OFF'}\nclap ${clap.phase} ${clap.count}/2\nfx ${FX[fxIndex].label}`}
function loop(now,token){if(!running||token!==loopToken)return;resizeCanvas();detect(now);updateClap(now);ctx.clearRect(0,0,W,H);bx.clearRect(0,0,W,H);if(spellMode)drawSpell(now);else drawNormal(now);rafCount++;if(now-rafWindow>=1000){renderFps=rafCount*1000/(now-rafWindow);detectFps=detCount*1000/(now-rafWindow);rafCount=detCount=0;rafWindow=now}drawDebug(now);requestAnimationFrame(t=>loop(t,token))}
debugBtn.onclick=()=>{debug=!debug;debugBtn.textContent=debug?'DEBUG ON':'DEBUG OFF';debugPanel.style.display=debug?'block':'none'};
fxBtn.onclick=()=>{if(spellMode){setStatus('Keluar spell dulu untuk ganti FX',true);return}fxIndex=(fxIndex+1)%FX.length;fxBtn.textContent=FX[fxIndex].label};
flip.onclick=async()=>{facing=facing==='user'?'environment':'user';try{await openCamera()}catch(e){setStatus(e.message)}};
go.onclick=async()=>{go.disabled=true;try{await openCamera();await loadTracker()}catch(e){console.error(e);setStatus(e.message);diagnostic('ERROR: '+e.message);go.disabled=false}};
})();
